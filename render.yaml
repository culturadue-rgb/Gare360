services:
  - type: web
    name: Gare360
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # inseriscila dalla dashboard Render, mai nel repo
      - key: STRATEGA_MODEL
        value: claude-opus-5
      - key: ALLOWED_ORIGINS
        value: https://gare360-ynfu.vercel.app
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: "3.12"
    disk:
      name: alloro-data
      mountPath: /var/data
      sizeGB: 1
