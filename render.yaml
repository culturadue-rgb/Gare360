services:
  - type: web
    name: alloro-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_data.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # inseriscila dalla dashboard Render, mai nel repo
      - key: STRATEGA_MODEL
        value: claude-sonnet-4-6
      - key: ALLOWED_ORIGINS
        sync: false          # es. https://alloro.vercel.app
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: "3.12"
    disk:
      name: alloro-data
      mountPath: /var/data
      sizeGB: 1
